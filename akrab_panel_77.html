<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الأدمن | EL3AKRAB</title>
<style>
:root{--bg:#070a12;--card:#0f1623;--bd:#1e293b;--tx:#f8fafc;--mu:#94a3b8;--pr:#2563eb;--ac:#10b981;color-scheme:dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);padding:16px;max-width:560px;margin:0 auto;line-height:1.6}
h1{font-size:1.3rem;margin:8px 0 16px}h2{font-size:1.05rem;margin-bottom:10px;color:#38bdf8}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=url],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
textarea{min-height:70px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
button{padding:11px 18px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:10px}
button.ok{background:var(--ac);width:100%;font-size:1.05rem}button.del{background:#b91c1c;margin:0;padding:6px 12px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.it img{width:48px;height:48px;object-fit:cover;border-radius:8px}.it span{flex:1;font-size:.9rem}
#pv{display:none;width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px}
#msg{margin:10px 0;font-weight:700;font-size:.9rem}#msg.ok{color:#34d399}#msg.err{color:#f87171}
small{color:var(--mu);font-size:.8rem}
</style></head><body>
<h1>🦂 لوحة الأدمن</h1>
<div id="msg"></div>
<div id="login" class="c">
<h2>تسجيل الدخول</h2>
<label>مفتاح GitHub (Token)</label><input type="password" id="tok" autocomplete="off">
<label>المستودع</label><input type="text" id="repo" value="el3akrab-ai/el3akrab-ai.github.io" dir="ltr">
<button id="go">دخول</button>
<p><small>المفتاح بيتحفظ على جهازك بس. من غيره محدش يقدر يغيّر حاجة في الموقع.</small></p>
</div>
<div id="app" style="display:none">
<div class="c"><h2>📢 الإعلان (الشريط اللي فوق الموقع)</h2>
<div class="row"><input type="checkbox" id="an_on"><span>إظهار الإعلان</span></div>
<label>نص الإعلان</label><input type="text" id="an_t"></div>
<div class="c"><h2>🏷️ الخصم (على أسعار السكرتير)</h2>
<div class="row"><input type="checkbox" id="ds_on"><span>تفعيل الخصم</span></div>
<label>نسبة الخصم %</label><input type="number" id="ds_p" min="0" max="90">
<p><small>المنصة التعليمية مستثناة من الخصم.</small></p></div>
<div class="c"><h2>🖼️ إضافة شغل جديد</h2>
<label>العنوان</label><input type="text" id="pt">
<label>التصنيف (مثال: موقع، لعبة، نظام)</label><input type="text" id="pc">
<label>وصف قصير</label><textarea id="pd"></textarea>
<label>رابط الشغل (اختياري)</label><input type="url" id="pl" dir="ltr">
<label>صورة</label><input type="file" id="pf" accept="image/*"><img id="pv" alt="">
<button id="addp">+ إضافة للقايمة</button></div>
<div class="c"><h2>أعمالك الحالية</h2><div id="plist"></div></div>
<button class="ok" id="pub">نشر التغييرات</button>
<button id="out" style="background:#334155;width:100%">تسجيل خروج</button>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var D={announcement:{on:false,text:''},discount:{on:true,percent:50},projects:[]},sha=null,tok='',repo='',pend=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function msg(t,ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':'err'}
function api(p,o){o=o||{};o.headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'};return fetch('https://api.github.com/repos/'+repo+'/contents/'+p,o)}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function unb64(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
function put(p,c,sh,m){var b={message:m,content:c};if(sh)b.sha=sh;return api(p,{method:'PUT',body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,100))});return r.json()})}
function list(){var l=$('plist');l.innerHTML='';if(!D.projects.length){l.textContent='مفيش أعمال لسه.';return}D.projects.forEach(function(p,i){var d=document.createElement('div');d.className='it';var im=document.createElement('img');im.src=p._b64||p.img||'';im.alt='';var s=document.createElement('span');s.textContent=p.title+(p.cat?' — '+p.cat:'');var b=document.createElement('button');b.className='del';b.textContent='حذف';b.onclick=function(){D.projects.splice(i,1);list()};d.appendChild(im);d.appendChild(s);d.appendChild(b);l.appendChild(d)})}
function fill(){$('an_on').checked=!!D.announcement.on;$('an_t').value=D.announcement.text||'';$('ds_on').checked=!!D.discount.on;$('ds_p').value=D.discount.percent;D.projects=D.projects||[];list()}
$('go').onclick=function(){tok=$('tok').value.trim();repo=$('repo').value.trim();if(!tok||!repo)return msg('اكتب المفتاح واسم المستودع');
api('data.json').then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
if(j){sha=j.sha;try{D=Object.assign(D,JSON.parse(unb64(j.content)))}catch(e){}}
ls('tok',tok);ls('repo',repo);$('login').style.display='none';$('app').style.display='block';fill();msg('',1)}).catch(function(e){msg('فشل الدخول، راجع المفتاح واسم المستودع ('+e.message+')')})};
$('out').onclick=function(){ls('tok',null);location.reload()};
$('pf').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.82);$('pv').src=pend;$('pv').style.display='block'};im.src=r.result};r.readAsDataURL(f)};
$('addp').onclick=function(){var t=$('pt').value.trim();if(!t)return msg('اكتب عنوان الشغل');D.projects.unshift({id:'p'+Date.now(),title:t,cat:$('pc').value.trim(),desc:$('pd').value.trim(),link:$('pl').value.trim(),_b64:pend});['pt','pc','pd','pl','pf'].forEach(function(i){$(i).value=''});pend=null;$('pv').style.display='none';list();msg('اتضاف للقايمة. اضغط "نشر التغييرات" عشان يظهر في الموقع.',1)};
$('pub').onclick=function(){D.announcement={on:$('an_on').checked,text:$('an_t').value.trim()};D.discount={on:$('ds_on').checked,percent:Math.min(90,Math.max(0,+$('ds_p').value||0))};msg('جاري النشر...',1);var ch=Promise.resolve();
D.projects.forEach(function(p){if(p._b64){ch=ch.then(function(){return put('img/'+p.id+'.jpg',p._b64.split(',')[1],null,'add image').then(function(){p.img='img/'+p.id+'.jpg';delete p._b64})})}});
ch.then(function(){return put('data.json',b64(JSON.stringify(D,null,1)),sha,'update site data')}).then(function(j){sha=j.content.sha;list();msg('تم النشر ✅ الموقع هيتحدّث خلال دقيقة تقريبًا.',1)}).catch(function(e){msg('فشل النشر: '+e.message)})};
var st=ls('tok'),sr=ls('repo');if(st)$('tok').value=st;if(sr)$('repo').value=sr;
</script></body></html>
